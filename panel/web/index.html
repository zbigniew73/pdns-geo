<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pdns-geo panel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>pdns-geo panel</h1>
  <div id="user-bar" hidden>
    <span id="user-email"></span>
    <button id="logout-btn" type="button">Wyloguj</button>
  </div>
</header>

<main>
  <section id="view-login">
    <form id="login-form">
      <h2>Logowanie</h2>
      <label>
        E-mail
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>
        Haslo
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p class="error" id="login-error" hidden></p>
      <button type="submit">Zaloguj</button>
    </form>
  </section>

  <section id="view-change-password" hidden>
    <form id="change-password-form">
      <h2>Wymagana zmiana hasla</h2>
      <p>To pierwsze logowanie na tymczasowym hasle — ustaw nowe haslo, zeby kontynuowac.</p>
      <label>
        Obecne haslo
        <input type="password" id="current-password" required autocomplete="current-password" />
      </label>
      <label>
        Nowe haslo (min. 8 znakow)
        <input type="password" id="new-password" required minlength="8" autocomplete="new-password" />
      </label>
      <p class="error" id="change-password-error" hidden></p>
      <button type="submit">Zmien haslo</button>
    </form>
  </section>

  <section id="view-dashboard" hidden>
    <h2>Strefy DNS</h2>
    <p id="zones-status"></p>
    <table id="zones-table" hidden>
      <thead><tr><th>Nazwa</th><th>Typ</th><th>Serial</th></tr></thead>
      <tbody id="zones-body"></tbody>
    </table>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
