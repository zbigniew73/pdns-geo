<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pdns-geo panel</title>
<script src="theme-init.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="view-login" class="screen">
  <div class="login-box">
    <h1>pdns-geo panel</h1>
    <form id="login-form">
      <label for="login-email" data-i18n="login_email_label">E-mail</label>
      <input type="email" id="login-email" required autocomplete="username" autofocus />
      <label for="login-password" data-i18n="login_password_label">Haslo</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
      <p class="error-msg" id="login-error" hidden></p>
      <button type="submit" data-i18n="login_btn">Zaloguj</button>
    </form>
  </div>
</div>

<div id="view-change-password" class="screen" hidden>
  <div class="login-box">
    <h1 data-i18n="change_password_title">Wymagana zmiana hasla</h1>
    <form id="change-password-form">
      <p class="hint" data-i18n="change_password_hint">To pierwsze logowanie na tymczasowym hasle — ustaw nowe, zeby kontynuowac.</p>
      <label for="current-password" data-i18n="current_password_label">Obecne haslo</label>
      <input type="password" id="current-password" required autocomplete="current-password" />
      <label for="new-password" data-i18n="new_password_label">Nowe haslo (min. 8 znakow)</label>
      <input type="password" id="new-password" required minlength="8" autocomplete="new-password" />
      <p class="error-msg" id="change-password-error" hidden></p>
      <button type="submit" data-i18n="change_password_btn">Zmien haslo</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="panelIconGrad" x1="0" y1="0" x2="32" y2="32"><stop offset="0" stop-color="#12a594"/><stop offset="1" stop-color="#155e75"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#panelIconGrad)"/>
        <text x="16" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#ffffff">DNS</text>
      </svg>
      <h1>pdns-geo panel</h1>
    </div>
    <div class="header-actions">
      <span id="user-email" class="user-email"></span>
      <span class="lang-switch-group">
        <span class="lang-switch" data-lang="pl">PL</span> <span class="lang-sep">|</span> <span class="lang-switch" data-lang="en">EN</span>
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" data-i18n-title="theme_toggle_title"></button>
      <button class="secondary" id="logout-btn" type="button" data-i18n="logout_btn">Wyloguj</button>
    </div>
  </header>
  <main class="content">
    <div class="panel-block">
      <h2 data-i18n="zones_title">Strefy DNS</h2>
      <p class="empty-state" id="zones-status"></p>
      <table class="zones" id="zones-table" hidden>
        <thead><tr><th data-i18n="th_name">Nazwa</th><th data-i18n="th_type">Typ</th><th data-i18n="th_serial">Serial</th></tr></thead>
        <tbody id="zones-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
