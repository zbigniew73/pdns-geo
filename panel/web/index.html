<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pdns-geo panel</title>
<script src="theme-init.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="view-login" class="screen">
  <div class="login-box">
    <h1>pdns-geo panel</h1>
    <form id="login-form">
      <label for="login-email" data-i18n="login_email_label">E-mail</label>
      <input type="email" id="login-email" required autocomplete="username" autofocus />
      <label for="login-password" data-i18n="login_password_label">Haslo</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
      <p class="error-msg" id="login-error" hidden></p>
      <button type="submit" data-i18n="login_btn">Zaloguj</button>
    </form>
  </div>
</div>

<div id="view-change-password" class="screen" hidden>
  <div class="login-box">
    <h1 data-i18n="change_password_title">Wymagana zmiana hasla</h1>
    <form id="change-password-form">
      <p class="hint" data-i18n="change_password_hint">To pierwsze logowanie na tymczasowym hasle — ustaw nowe, zeby kontynuowac.</p>
      <label for="current-password" data-i18n="current_password_label">Obecne haslo</label>
      <input type="password" id="current-password" required autocomplete="current-password" />
      <label for="new-password" data-i18n="new_password_label">Nowe haslo (min. 8 znakow)</label>
      <input type="password" id="new-password" required minlength="8" autocomplete="new-password" />
      <p class="error-msg" id="change-password-error" hidden></p>
      <button type="submit" data-i18n="change_password_btn">Zmien haslo</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="panelIconGrad" x1="0" y1="0" x2="32" y2="32"><stop offset="0" stop-color="#12a594"/><stop offset="1" stop-color="#155e75"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#panelIconGrad)"/>
        <text x="16" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#ffffff">DNS</text>
      </svg>
      <h1>pdns-geo panel</h1>
    </div>
    <div class="header-actions">
      <span id="user-email" class="user-email"></span>
      <span class="lang-switch-group">
        <span class="lang-switch" data-lang="pl">PL</span> <span class="lang-sep">|</span> <span class="lang-switch" data-lang="en">EN</span>
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" data-i18n-title="theme_toggle_title"></button>
      <button class="secondary" id="logout-btn" type="button" data-i18n="logout_btn">Wyloguj</button>
    </div>
  </header>
  <main>
    <nav>
      <div class="nav-section-label" data-i18n="nav_main">Glowne</div>
      <button class="tab active" type="button" data-tab="zones" data-i18n="tab_zones">Strefy DNS</button>
      <button class="tab" type="button" data-tab="settings" data-i18n="tab_settings">Ustawienia</button>
    </nav>
    <div class="content">
      <div id="content-zones">
        <div class="system-grid" id="system-grid"></div>
        <div class="grid">
          <div class="card">
            <h2 data-i18n="zones_title">Strefy DNS</h2>
            <p class="empty-state" id="zones-status"></p>
            <table class="zones" id="zones-table" hidden>
              <thead><tr><th data-i18n="th_name">Nazwa</th><th data-i18n="th_type">Typ</th><th data-i18n="th_serial">Serial</th></tr></thead>
              <tbody id="zones-body"></tbody>
            </table>
          </div>
          <div class="card">
            <h2 data-i18n="dns_servers_title">Serwery DNS</h2>
            <p class="empty-state" id="dns-servers-status" hidden></p>
            <div id="dns-servers-list"></div>
          </div>
        </div>
      </div>
      <div id="content-settings" hidden>
        <div class="grid">
          <div class="card">
            <h2 data-i18n="admin_info_title">Informacje Administratora</h2>
            <form id="email-form">
              <label class="field" for="settings-email" data-i18n="current_email_label">Aktualny e-mail</label>
              <input class="field-input" type="email" id="settings-email" required />
              <label class="field" for="settings-email-password" data-i18n="current_password_label">Obecne haslo</label>
              <input class="field-input" type="password" id="settings-email-password" required autocomplete="current-password" />
              <p class="error-msg" id="email-error" hidden></p>
              <p class="success-msg" id="email-success" hidden></p>
              <button type="submit" data-i18n="save_email_btn">Zapisz e-mail</button>
            </form>
            <hr />
            <form id="settings-password-form">
              <label class="field" for="settings-current-password" data-i18n="current_password_label">Obecne haslo</label>
              <input class="field-input" type="password" id="settings-current-password" required autocomplete="current-password" />
              <label class="field" for="settings-new-password" data-i18n="new_password_label">Nowe haslo (min. 8 znakow)</label>
              <input class="field-input" type="password" id="settings-new-password" required minlength="8" autocomplete="new-password" />
              <p class="error-msg" id="settings-password-error" hidden></p>
              <p class="success-msg" id="settings-password-success" hidden></p>
              <button type="submit" data-i18n="save_password_btn">Zmien haslo</button>
            </form>
          </div>
          <div class="card">
            <h2 data-i18n="account_info_title">Konto</h2>
            <div class="info-row"><span class="info-label" data-i18n="role_label">Rola</span><span id="info-role"></span></div>
            <div class="info-row"><span class="info-label" data-i18n="created_label">Utworzono</span><span id="info-created"></span></div>
          </div>
          <div class="card">
            <h2 data-i18n="powerdns_conn_title">Polaczenie z PowerDNS API</h2>
            <form id="powerdns-form">
              <label class="field" for="powerdns-address" data-i18n="powerdns_address_label">Adres (ns1)</label>
              <input class="field-input" type="text" id="powerdns-address" placeholder="np. 10.0.0.1" required />
              <label class="field" for="powerdns-port" data-i18n="powerdns_port_label">Port</label>
              <input class="field-input" type="number" id="powerdns-port" placeholder="8081" required />
              <label class="field" for="powerdns-api-key" data-i18n="powerdns_api_key_label">API Key</label>
              <input class="field-input" type="password" id="powerdns-api-key" autocomplete="off" />
              <p class="empty-state" id="powerdns-api-key-hint" hidden></p>
              <p class="error-msg" id="powerdns-error" hidden></p>
              <p class="success-msg" id="powerdns-success" hidden></p>
              <button type="submit" data-i18n="save_btn">Zapisz</button>
            </form>
          </div>
          <div class="card">
            <h2 data-i18n="powerdns_test_title">Test polaczenia</h2>
            <p class="empty-state" id="powerdns-test-status"></p>
            <button type="button" id="powerdns-test-btn" data-i18n="powerdns_test_btn">Testuj polaczenie</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="app-footer">
    <span id="footer-clock"></span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
